name: Preparar modelos nuevos

# Para los modelos en borrador: trae la ficha de RunRepeat, busca precios y talles en las tiendas, los suma
# y baja fotos de producto. Deja todo en el repo para revisarlo; los borradores no se ven en el sitio.
on:
  workflow_dispatch:
    inputs:
      fotos:
        description: "Solo bajar fotos de estos modelos (slugs separados por espacio). Vacío = todo el proceso"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  preparar:
    runs-on: ubuntu-latest
    env:
      UA_ROBOT: "Mozilla/5.0 (compatible; TrotecitoBot/1.0; +https://trotecito.com.ar/)"
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fichas de RunRepeat
        if: inputs.fotos == ''
        run: node scripts/fichas-runrepeat.mjs
        continue-on-error: true
      - name: Buscar precios y talles en las tiendas
        if: inputs.fotos == ''
        run: node scripts/buscar-ofertas.mjs --borradores
      - name: Sumar las ofertas encontradas
        if: inputs.fotos == ''
        run: node scripts/sumar-ofertas.mjs --guardar
      - name: Bajar fotos
        timeout-minutes: 25
        continue-on-error: true   # si una tienda se cuelga, se guarda igual lo que se consiguió
        env:
          FOTOS: ${{ inputs.fotos }}
        run: node scripts/bajar-fotos-tiendas.mjs $FOTOS
      - name: Guardar
        run: |
          git config user.name "trotecito-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts public/data && git add -f scripts/fotos-nuevas
          git diff --cached --quiet || (git commit -m "Modelos nuevos: fichas, ofertas y fotos para revisar" && for i in 1 2 3; do git pull --rebase --autostash -X theirs && git push && break; sleep 15; done)
