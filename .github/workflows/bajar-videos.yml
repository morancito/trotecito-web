name: Bajar videos de fondo

# Baja videos de stock con licencia libre (Mixkit) para elegir el fondo de la portada.
# No los guarda en el repo (pesan mucho): quedan como artefacto de la corrida, para bajarlos con `gh run download`.
on:
  workflow_dispatch:
    inputs:
      ids:
        description: "IDs de videos de Mixkit separados por espacio"
        required: true

permissions:
  contents: read

jobs:
  bajar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bajar
        env:
          IDS: ${{ inputs.ids }}
        run: |
          mkdir -p scripts/videos
          for id in $IDS; do
            case "$id" in (*[!0-9]*) echo "id inválido: $id"; continue;; esac
            for q in 1080 720 360; do
              if curl -fsSL -A "Mozilla/5.0 (compatible; TrotecitoBot/1.0)" -o "scripts/videos/$id.mp4" "https://assets.mixkit.co/videos/$id/$id-$q.mp4"; then echo "$id: $q ok"; break; fi
            done
            curl -fsSL -o "scripts/videos/$id.jpg" "https://assets.mixkit.co/videos/$id/$id-thumb-720-0.jpg" || true
          done
          ls -la scripts/videos
      - uses: actions/upload-artifact@v4
        with:
          name: videos
          path: scripts/videos
          retention-days: 7
