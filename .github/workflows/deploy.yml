name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Todos los días a las 06:17 de Argentina (09:17 UTC): actualiza precios y publica
    - cron: "17 9 * * *"
  workflow_dispatch:
    inputs:
      precios:
        description: "Actualizar precios antes de publicar"
        type: boolean
        default: true

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Actualizar precios
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.precios)
        run: node scripts/actualizar-precios.mjs

      - name: Guardar precios en el repo
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.precios)
        run: |
          git config user.name "trotecito-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          git diff --cached --quiet || (git commit -m "Precios del $(TZ=America/Argentina/Buenos_Aires date +%d/%m/%Y)" && git push)

      - run: npm ci
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
