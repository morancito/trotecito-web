name: Importar precios manuales

# Cuando se sube un archivo a datos-manuales/ (lo baja el marcador Trotecito desde nike.com.ar o adidas.com.ar),
# carga esos precios en el catálogo y borra el archivo. También se puede correr a mano.
on:
  push:
    branches: [main]
    paths: ["datos-manuales/*.json"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: importar-manual
  cancel-in-progress: false

jobs:
  importar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Importar
        run: node scripts/importar-manual.mjs && node scripts/validar-datos.mjs
      - name: Guardar
        run: |
          git config user.name "trotecito-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A public/data datos-manuales scripts/nike-imagenes.json
          git diff --cached --quiet || (git commit -m "Precios de Nike/adidas cargados desde el marcador" && for i in 1 2 3; do git pull --rebase --autostash -X theirs && git push && break; sleep 15; done)
