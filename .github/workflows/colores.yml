name: Buscar colores

# Busca en las tiendas todas las variantes de color de cada modelo, baja la foto de cada una y la procesa.
# Deja scripts/colores.json (crudo), public/data/colores.json (lo lee la ficha) y public/fotos/<modelo>/c<n>.webp.
# Corre sola los domingos para tener precios y stock de cada color al día.
# Corre en tandas: si se le acaba el tiempo guarda lo hecho y se vuelve a lanzar sola con los modelos que faltan.
on:
  schedule:
    - cron: "41 6 * * 0"
  workflow_dispatch:
    inputs:
      modelos:
        description: "Slugs separados por espacio (vacío = todos)"
        required: false
        default: ""
      faltantes:
        description: "Saltar los modelos que ya tienen colores"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: colores
  cancel-in-progress: false

jobs:
  colores:
    runs-on: ubuntu-latest
    env:
      UA_ROBOT: "Mozilla/5.0 (compatible; TrotecitoBot/1.0; +https://trotecito.com.ar/)"
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Buscar variantes
        env:
          MODELOS: ${{ inputs.modelos }}
          FALTANTES: ${{ inputs.faltantes && '1' || '' }}
          MINUTOS: "280"
        run: node scripts/colores.mjs $MODELOS
      - name: Procesar fotos
        run: |
          pip install --quiet pillow
          python3 scripts/colores-fotos.py
      - name: Guardar
        run: |
          git config user.name "trotecito-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git status --short | head -20
          git add scripts/colores.json public/data/colores.json public/fotos
          git diff --cached --quiet || git commit -m "Colores de cada modelo"
          for i in 1 2 3; do git pull --rebase --autostash -X theirs && git push && break; sleep 15; done
      - name: Seguir con los que faltan
        if: hashFiles('scripts/colores-faltan.txt') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run colores.yml --ref main -f faltantes=true
