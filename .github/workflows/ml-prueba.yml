name: Probar Mercado Libre
# Prueba qué deja consultar la API de Mercado Libre con la app de Trotecito. No cambia nada del sitio.
on:
  workflow_dispatch:
    inputs:
      script:
        description: "ml-prueba (precios) o ml-opiniones"
        default: ml-prueba
permissions:
  contents: read
jobs:
  probar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Probar la API
        env:
          ML_CLIENT_ID: ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
          SCRIPT: ${{ inputs.script }}
        run: |
          case "$SCRIPT" in ml-opiniones) node scripts/ml-opiniones.mjs ;; *) node scripts/ml-prueba.mjs ;; esac
