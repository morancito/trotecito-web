<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Zapada</title>
<meta name="description" content="Compará las zapatillas de running que se consiguen en Argentina y comprá donde están más baratas.">
<meta property="og:title" content="Zapada · Zapas de running en Argentina">
<meta property="og:description" content="¿Qué zapa te va? Compará modelos y precios de todas las tiendas.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#FFC700">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Shrikhand&family=JetBrains+Mono:wght@500&display=swap">
</head>
<body>
<!--BODY-->
<div class="top"><div class="wrap">
  <a class="logo" href="#"><i aria-hidden="true"></i>Zapada</a>
  <nav class="nav"><a href="#catalogo">Zapas</a><a href="#aprender">Aprendé</a></nav>
</div></div>

<div id="home">
  <section class="hero"><div class="wrap hero-in">
    <div>
      <p class="kicker">Zapatillas de running · Argentina</p>
      <h1 class="cond">¿Qué zapa<br>te <em>va?</em></h1>
      <p class="lede">Compará los modelos que se consiguen acá y comprá donde están más baratos.</p>
      <div class="ctas"><a class="btn fuerte" href="#catalogo">Ver zapas</a><a class="btn" href="#aprender">Aprendé en 3D</a></div>
    </div>
    <div class="hero-art"><div class="sol" aria-hidden="true"></div><div class="stage" id="heroStage"><div class="lbls"></div></div></div>
  </div></section>

  <div class="ticker"><div class="tk-track" id="ticker"></div></div>

  <section class="blk" id="aprender"><div class="wrap">
    <div class="head"><h2 class="sec cond">Aprendé <span>en 3D</span></h2>
      <div class="tabs" role="tablist" id="lanes"></div></div>
    <div class="lab-grid">
      <div class="lab-stage"><div class="stage" id="labStage"><div class="lbls"></div></div><div class="views" id="labViews"></div></div>
      <div class="lab-text" id="labtext" role="tabpanel"></div>
    </div>
  </div></section>

  <section class="blk" id="catalogo"><div class="wrap">
    <div class="head"><h2 class="sec cond">Las <span>zapas</span></h2>
      <input type="search" class="buscar" id="q" placeholder="Buscá un modelo o marca" aria-label="Buscar"></div>
    <div class="filtros" id="filtros"></div>
    <div class="grid" id="grid"></div>
    <p class="empty" id="empty" hidden>No hay zapas con esos filtros.</p>
  </div></section>
</div>

<div id="detalle" class="wrap det" hidden></div>
<div id="comparar" class="wrap det" hidden></div>

<footer><div class="wrap">
  <div class="foot-logo">Zapada</div>
  <p>Hecho en Argentina, para los que corren.</p>
</div></footer>

<div class="tray" id="tray" hidden><div class="wrap">
  <b id="traytxt"></b>
  <span><button class="clear" id="trayclear">Limpiar</button> <button id="traygo">Comparar</button></span>
</div></div>
<!--/BODY-->
<script type="module" src="/src/main.js"></script>
</body>
</html>
