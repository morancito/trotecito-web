name: Actualizar precios

# El robot lee los precios de las tiendas, actualiza el punto del día en el historial y guarda los cambios en el repo;
# Cloudflare ve el cambio en main y publica el sitio solo.
# Arranca de dos maneras:
#  - apenas termina "Importar precios manuales" (lo dispara el programa de la compu a las 08:30 y 12:30): es puntual;
#  - por horario (08:07, 12:07 y 18:07 de Argentina), como respaldo. GitHub arranca las programadas con atraso, a veces
#    de varias horas; si ya hubo una actualización hace menos de 3 horas, la programada no hace nada.
# También se puede correr a mano desde la pestaña Actions.
on:
  schedule:
    - cron: "7 11 * * *"
    - cron: "7 15 * * *"
    - cron: "7 21 * * *"
  workflow_run:
    workflows: ["Importar precios manuales"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: precios
  cancel-in-progress: false

jobs:
  precios:
    runs-on: ubuntu-latest
    steps:
      - name: ¿Ya se actualizó hace poco?
        id: reciente
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ult=$(gh run list -R "$GITHUB_REPOSITORY" --workflow precios.yml --status success -L 1 --json createdAt -q '.[0].createdAt')
          if [ -n "$ult" ] && [ $(( $(date +%s) - $(date -d "$ult" +%s) )) -lt 10800 ]; then
            echo "Ya hubo una actualización a las $ult (hace menos de 3 horas): esta no hace falta."
            echo "saltar=1" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.reciente.outputs.saltar != '1'
      - uses: actions/setup-node@v4
        if: steps.reciente.outputs.saltar != '1'
        with:
          node-version: 22

      - name: Leer precios de las tiendas
        if: steps.reciente.outputs.saltar != '1'
        run: node scripts/actualizar-precios.mjs

      - name: Revisar los datos antes de guardar
        if: steps.reciente.outputs.saltar != '1'
        run: node scripts/validar-datos.mjs

      - name: Guardar precios en el repo
        if: steps.reciente.outputs.saltar != '1'
        run: |
          git config user.name "trotecito-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          git diff --cached --quiet || (git commit -m "Precios del $(TZ=America/Argentina/Buenos_Aires date +%d/%m/%Y\ %H:%M)" && for i in 1 2 3; do git pull --rebase --autostash -X theirs && git push && break; sleep 15; done)
