name: Revisar fichas

# Junta lo que dicen sitios de referencia (Foroatletismo) sobre cada modelo, para compararlo con nuestras fichas.
# No toca el catálogo: deja los datos en scripts/ para revisarlos.
on:
  workflow_dispatch:
    inputs:
      paso:
        description: "foro, segunda o todo"
        required: false
        default: "todo"

permissions:
  contents: write

jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Foroatletismo
        if: inputs.paso != 'segunda'
        run: node scripts/foro-atletismo.mjs
      - name: Segunda fuente y horma
        if: inputs.paso != 'foro'
        run: node scripts/segunda-fuente.mjs
      - name: Guardar
        run: |
          git config user.name "trotecito-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/foro-atletismo.json scripts/segunda-fuente.json
          git diff --cached --quiet || (git commit -m "Revisión de fichas: datos de Foroatletismo" && git pull --rebase && git push)
